name: Test and Build

enable-openid-connect: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - v*

jobs:
  test:
    runs-on: alpine
    steps:
      - uses: actions/toolkit/git-checkout@master
      - uses: actions/toolkit/go-setup@master
      - uses: actions/toolkit/go-test@master
  race-test:
    runs-on: alpine
    steps:
      - uses: actions/toolkit/git-checkout@master
      - uses: actions/toolkit/go-setup@master
      - name: Install C toolchain (required by the race detector)
        # musl must be named explicitly: apk caches images pin exact versions in
        # /etc/apk/world, and naming a package rewrites its pin to the latest
        # available version (apk upgrade alone will not move a pin).
        run: apk add --no-cache musl gcc musl-dev
      - name: Test with race detector
        run: go test -race ./...
  container:
    runs-on: alpine
    needs:
      - race-test
    steps:
      - uses: actions/toolkit/git-checkout@master
      - uses: actions/toolkit/docker-login@master
        with:
          audience: u:1:4aa2cbb2-4cab-44d3-b0d5-056eeda66035
      - uses: actions/toolkit/docker-push@master
